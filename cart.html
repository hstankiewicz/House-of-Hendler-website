<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart | House of Hendler</title>
<link rel="icon" href="assets/img/logo.png">
<link rel="stylesheet" href="assets/css/style.css">
<style>
.cart-page{background:var(--hoh-cream);min-height:68vh;padding:56px 24px 80px}.cart-shell{max-width:900px;margin:0 auto}.cart-panel{background:#fff;border:1px solid var(--hoh-gold-soft);padding:34px}.cart-row{display:grid;grid-template-columns:1fr auto auto;gap:20px;align-items:center;padding:18px 0;border-bottom:1px solid #e7e7e7}.cart-name{font-weight:700;color:var(--hoh-navy)}.cart-price{color:var(--hoh-ink-soft)}.cart-qty{display:flex;align-items:center;gap:10px}.cart-qty button{width:34px;height:34px;border:1px solid #cfd3d8;background:#fff;cursor:pointer;font:inherit}.cart-total{font-weight:700;color:var(--hoh-navy);min-width:80px;text-align:right}.cart-footer{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-top:26px;flex-wrap:wrap}.cart-subtotal{font-size:18px;font-weight:700;color:var(--hoh-navy)}.cart-error{color:#9f1239;font-size:14px;margin-top:16px}.cart-note{font-size:13px;color:var(--hoh-ink-soft);margin-top:10px}@media(max-width:680px){.cart-row{grid-template-columns:1fr auto}.cart-total{grid-column:1/-1;text-align:left}.cart-panel{padding:24px}}
</style>
</head>
<body>
<header>
  <div class="announcement-bar"><div class="announcement-track container" data-announcement-track></div></div>
  <div class="site-header"><div class="header-inner">
    <a href="index.html" class="brand-logo" aria-label="House of Hendler — home"><img src="assets/img/logo.png" alt="House of Hendler logo" width="140" height="164"></a>
    <nav class="main-nav" aria-label="Primary"><a href="shop.html">SHOP</a><a href="our-story.html">OUR STORY</a><a href="wholesale.html">WHOLESALE</a><a href="contact.html">CONTACT</a></nav>
  </div></div>
</header>
<main class="cart-page">
  <div class="cart-shell">
    <div class="cart-panel">
      <span class="eyebrow">Your order</span>
      <h1>Your cart</h1>
      <div id="cart-items"></div>
      <div class="cart-footer">
        <div><div id="cart-subtotal" class="cart-subtotal"></div><div class="cart-note">Shipping will be added at checkout after your address is entered.</div></div>
        <div><a class="btn btn-navy" href="shop.html">Continue shopping</a> <button class="btn btn-pink" id="checkout-button" type="button">Checkout</button></div>
      </div>
      <p id="cart-error" class="cart-error" hidden></p>
    </div>
  </div>
</main>
<footer class="site-footer"><div class="container"><div class="footer-bottom"><span>&copy; <span data-current-year></span> House of Hendler. All rights reserved.</span><div class="legal-links"><a href="privacy.html">Privacy Policy</a><a href="terms.html">Terms of Service</a><a href="contact.html">Contact Us</a></div></div></div></footer>
<script src="assets/js/config.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/cart-page-rebuild.js"></script>
</body>
</html>
